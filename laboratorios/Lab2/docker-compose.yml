services:
  db:
    image: postgis/postgis:16-3.4
    container_name: lab2-postgis
    environment:
      POSTGRES_DB: db_laboratorio
      POSTGRES_USER: admin_raid
      POSTGRES_PASSWORD: superpassword123
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_raid -d db_laboratorio"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend/mmorpg
    container_name: lab2-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/db_laboratorio
      SPRING_DATASOURCE_USERNAME: admin_raid
      SPRING_DATASOURCE_PASSWORD: superpassword123
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

# ============================================
# USO EN DESARROLLO
# ============================================
# docker compose up -d          ← BD + Backend
# cd frontend && npm run dev    ← Frontend local
# ============================================
