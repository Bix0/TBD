services:
  # Nodo Primario de MongoDB
  mongo-primary:
    image: mongo:6.0
    container_name: mongo-primary
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_primary_data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - mmorpg-network

  # Nodo Secundario de MongoDB
  mongo-secondary:
    image: mongo:6.0
    container_name: mongo-secondary
    ports:
      - "27018:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_secondary_data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - mmorpg-network

  # Contenedor temporal para inicializar el clúster
  mongo-setup:
    image: mongo:6.0
    depends_on:
      mongo-primary:
        condition: service_healthy
      mongo-secondary:
        condition: service_healthy
    networks:
      - mmorpg-network
    restart: "no"
    entrypoint:
      - mongosh
      - --host
      - mongo-primary:27017
      - --quiet
      - --eval
      - |
        var done = false;
        for (var i = 0; i < 30 && !done; i++) {
          try {
            rs.status();
            done = true;
            print("Replica set ya estaba inicializado");
          } catch (e) {
            try {
              rs.initiate({
                _id: "rs0",
                members: [
                  { _id: 0, host: "mongo-primary:27017" },
                  { _id: 1, host: "mongo-secondary:27017" }
                ]
              });
              done = true;
              print("Replica set inicializado correctamente");
            } catch (e2) {
              print("Intento " + i + ": " + e2.message);
              sleep(2000);
            }
          }
        }
        if (!done) { quit(1); }

  # Servicio de Backend (Spring Boot / Java)
  backend:
    build: ./backend/mmorpg
    container_name: mmorpg-backend
    ports:
      - "8080:8080"
    depends_on:
      mongo-setup:
        condition: service_completed_successfully
    networks:
      - mmorpg-network

  # Servicio de Frontend (React / Vite + Nginx)
  frontend:
    build: ./frontend
    container_name: mmorpg-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mmorpg-network

volumes:
  mongo_primary_data:
  mongo_secondary_data:

networks:
  mmorpg-network:
    driver: bridge
